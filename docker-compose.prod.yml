version: '3.8'

# Production Docker Compose for sazkomat.herma.cz
# Usage: docker-compose -f docker-compose.prod.yml up -d

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sazkomat-postgres
    environment:
      POSTGRES_USER: sazkomat
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: sazkomat_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sazkomat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sazkomat-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: sazkomat-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - sazkomat-network
    restart: unless-stopped

  # .NET 9 API
  api:
    build:
      context: .
      dockerfile: src/Sazkomat.Api/Dockerfile
    container_name: sazkomat-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:3001
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=sazkomat_db;Username=sazkomat;Password=${DB_PASSWORD}
      - ConnectionStrings__RedisConnection=redis:6379
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - Authentication__Google__ClientId=${GOOGLE_CLIENT_ID}
      - Authentication__Google__ClientSecret=${GOOGLE_CLIENT_SECRET}
      - AdminSettings__AdminEmail=${ADMIN_EMAIL}
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sazkomat-network
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    restart: unless-stopped

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://sazkomat.herma.cz/api
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    container_name: sazkomat-frontend
    environment:
      - NODE_ENV=production
    expose:
      - "3000"
    depends_on:
      - api
    networks:
      - sazkomat-network
    restart: unless-stopped

  # Nginx Reverse Proxy with SSL
  nginx:
    image: nginx:alpine
    container_name: sazkomat-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_data:/var/www/certbot:ro
    depends_on:
      - frontend
      - api
    networks:
      - sazkomat-network
    restart: unless-stopped

  # Certbot for SSL certificate renewal (optional, run periodically)
  certbot:
    image: certbot/certbot
    container_name: sazkomat-certbot
    volumes:
      - certbot_data:/var/www/certbot
      - ./nginx/ssl:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - sazkomat-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  certbot_data:
    driver: local

networks:
  sazkomat-network:
    driver: bridge
